<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link  href="./style.css" rel="stylesheet"> 
  <script defer src="./script.js"></script>
</head>

<body>

  <main class="contact">
    <h1 class="contact__title">Contact Us</h1>

    <form class="contact__form" novalidate>

      <!-- First Name -->
      <div class="form-group">
        <label for="first-name">First Name</label>
        <input id="first-name" name="first-name" type="text" required>
        <p class="error-message">This field is required</p>
      </div>

      <!-- Last Name -->
      <div class="form-group">
        <label for="last-name">Last Name</label>
        <input id="last-name" name="last-name" type="text" required>
        <p class="error-message">This field is required</p>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" required>
        <p class="error-message">Please enter a valid email address</p>
      </div>

      <!-- Query Type -->
      <fieldset class="form-group query-group">
        <legend>Query Type</legend>
        <label class="radio-option">
          <input type="radio" name="query-type" value="general">
          <span>General Enquiry</span>
        </label>
        <label class="radio-option">
          <input type="radio" name="query-type" value="support">
          <span>Support Request</span>
        </label>
        <p class="error-message">Please select a query type</p>
      </fieldset>

      <!-- Message -->
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
        <p class="error-message">This field is required</p>
      </div>

      <!-- Consent -->
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" name="consent" required>
          I consent to being contacted by the team
        </label>
        <p class="error-message">To submit this form, please consent to being contacted</p>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-submit">Submit</button>
    </form>

    <!-- Success Message -->
    <div class="success-message">
      <h2>Message Sent!</h2>
      <p>Thanks for completing the form. We'll be in touch soon!</p>
    </div>
  </main>

</body>

</html>
