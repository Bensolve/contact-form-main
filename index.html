<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link href="./style.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet">
    
  <script defer src="./script.js"></script>
</head>

<body>
  <!-- Success Message (hidden by default) -->
  <div class="success-message">
    <h2>Message Sent!</h2>
    <p>Thanks for completing the form. We'll be in touch soon!</p>
  </div>

  <main class="contact">
    <h1 class="contact__title">Contact Us</h1>

    <!-- Form stays visible -->
    <form id="contact-form" class="contact__form" novalidate>

      <!-- First Name -->
      <div class="form-group">
        <label for="first-name">First Name</label>
        <input id="first-name" class="form-input" name="first-name" type="text" autocomplete="given-name" required>
        <p class="error-message">This field is required</p>
      </div>

      <!-- Last Name -->
      <div class="form-group">
        <label for="last-name">Last Name</label>
        <input id="last-name" class="form-input" name="last-name" type="text" autocomplete="family-name" required>
        <p class="error-message">This field is required</p>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" class="form-input" name="email" type="email" autocomplete="email" required>
        <p class="error-message">Please enter a valid email address</p>
      </div>

      <!-- Query Type -->
      <fieldset id="query-group" class="form-group query-group">
        <legend>Query Type</legend>
        <label class="radio-option">
          <input type="radio" name="query-type" value="general">
          <span>General Enquiry</span>
        </label>
        <label class="radio-option">
          <input type="radio" name="query-type" value="support">
          <span>Support Request</span>
        </label>
        <p class="error-message">Please select a query type</p>
      </fieldset>

      <!-- Message -->
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" class="form-input" name="message" autocomplete="off" required></textarea>
        <p class="error-message">This field is required</p>
      </div>

      <!-- Consent -->
      <div class="form-group checkbox-group">
        <label>
          <input id="consent-checkbox" type="checkbox" name="consent" required>
          I consent to being contacted by the team
        </label>
        <p class="error-message">To submit this form, please consent to being contacted</p>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-submit">Submit</button>
    </form>
  </main>

</body>

</html>
